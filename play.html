<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>VEXCHESS · Jugar contra la IA</title>
<meta name="description" content="Juega al ajedrez contra la IA directo en tu navegador. Modo entrenador, aviso de piezas en peligro, sonidos y temas de tablero. Gratis y offline.">
<link rel="canonical" href="https://vexchess.jgallegosoto12.workers.dev/play.html">
<meta name="theme-color" content="#0D1117">
<!-- Open Graph / Twitter -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="VEXCHESS">
<meta property="og:title" content="VEXCHESS · Jugar contra la IA">
<meta property="og:description" content="Ajedrez contra la IA en tu navegador. Gratis, sin registro y offline.">
<meta property="og:url" content="https://vexchess.jgallegosoto12.workers.dev/play.html">
<meta property="og:image" content="https://vexchess.jgallegosoto12.workers.dev/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VEXCHESS · Jugar contra la IA">
<meta name="twitter:description" content="Ajedrez contra la IA en tu navegador. Gratis, sin registro y offline.">
<meta name="twitter:image" content="https://vexchess.jgallegosoto12.workers.dev/assets/og-image.png">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" href="assets/favicon.png">
<script>/* arranca la descarga del catálogo de idioma ya, en paralelo con los JS */
try{var l=localStorage.getItem('vex_lang')||(navigator.language||'es').slice(0,2).toLowerCase();
if('es en ru de fr it pt hi zh ar nl uk pl fa'.split(' ').indexOf(l)<0)l='es';
var k=document.createElement('link');k.rel='preload';k.as='fetch';k.crossOrigin='anonymous';
k.href='lang/'+l+'.json';document.head.appendChild(k);}catch(e){}</script>
<link rel="modulepreload" href="i18n.js?v=9">
<link rel="modulepreload" href="account-chip.js?v=14">
<link rel="modulepreload" href="navbar.js?v=22">
<link rel="modulepreload" href="auth.js?v=31">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="style.css?v=48">
<link rel="stylesheet" href="ui.css?v=5">
<link rel="stylesheet" href="motion.css?v=3">
<link rel="stylesheet" href="navbar.css?v=19">
</head>
<body>
  <header id="vx-nav" data-variant="site" data-intro>
    <template data-slot="actions">
      <span id="engine-status" hidden></span>
    </template>
  </header>

  <div class="stage">
    <div class="player" id="player-top"></div>

    <div class="game">
      <div class="board-wrap">
        <div class="evalbar" id="evalbar" aria-hidden="true"><div class="evalbar-fill" id="evalbar-fill"></div></div>
        <div id="board"></div>
        <div class="pieces" id="pieces"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 8 8" preserveAspectRatio="none"></svg>
        <div class="promotion" id="promotion"></div>
        <div class="loader" id="loader">
          <div class="loader-inner">
            <div class="loader-ring"></div>
            <div class="loader-knight" id="loader-knight"></div>
          </div>
          <div class="loader-text" id="loader-text">Cargando el motor…</div>
        </div>

        <!-- Sorteo de color (Pawn Draw) -->
        <div class="draw" id="draw">
          <div class="draw-box">
            <div class="draw-title" id="draw-title">Sorteo de color</div>
            <div class="draw-hint" id="draw-hint">Elige una mano</div>
            <div class="draw-cards" id="draw-cards">
              <button class="draw-card" data-i="0"></button>
              <button class="draw-card" data-i="1"></button>
            </div>
            <div class="draw-msg" id="draw-msg"></div>
            <button class="draw-skip" id="draw-skip">Saltar</button>
          </div>
        </div>

        <!-- Asa para agrandar el tablero (fuera del tablero; aparece al acercar el ratón a ELLA) -->
        <div class="resize-zone" id="resize-zone">
          <button class="resize-handle" id="resize-handle" title="Arrastra para cambiar el tamaño del tablero" aria-label="Cambiar tamaño del tablero">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4v6M4 4l8 8M14 20h6v-6M20 20l-8-8" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="player" id="player-bottom"></div>
  </div>

  <!-- Estado/aviso flotante, justo encima del dock -->
  <div class="infobar" id="infobar">
    <div class="status" id="status"></div>
    <div class="eval" id="eval"></div>
    <div class="notice" id="notice"></div>
  </div>

  <!-- Popover de jugadas (historial) -->
  <div class="history-pop" id="history-pop">
    <div class="history-pop-head"><span id="moves-title">Jugadas</span><button class="pgn-btn" id="pgn-btn"><img src="assets/icons/gameplay/copy-pgn.svg" alt="" aria-hidden="true" style="width:.85rem;height:.85rem;vertical-align:-.13em;margin-right:.25rem">Copiar PGN</button></div>
    <div class="history" id="history"></div>
  </div>

  <!-- Barra flotante de controles -->
  <div class="dock" id="dock">
    <div class="seg" id="color-seg">
      <button class="seg-btn" data-color="w" id="color-w">Blancas</button>
      <button class="seg-btn" data-color="random" id="color-r">Aleatorio</button>
      <button class="seg-btn" data-color="b" id="color-b">Negras</button>
    </div>
    <span class="dock-sep"></span>
    <div class="dock-level"><select id="level" data-enhance></select></div>
    <span class="dock-break" aria-hidden="true"></span>
    <span class="dock-sep"></span>
    <div class="controls">
      <button class="ctrl" id="btn-undo"><img class="vex-icon--button" src="assets/icons/gameplay/undo.svg" alt="" aria-hidden="true">Deshacer</button>
      <button class="ctrl" id="btn-flip"><img class="vex-icon--button" src="assets/icons/gameplay/rotate-board.svg" alt="" aria-hidden="true">Girar</button>
      <button class="ctrl" id="btn-reset"><img class="vex-icon--button" src="assets/icons/gameplay/new-game.svg" alt="" aria-hidden="true">Nueva</button>
    </div>
    <span class="dock-sep"></span>
    <label class="dock-toggle" id="coach-wrap" title="Modo entrenador">
      <input type="checkbox" id="toggle-coach"><span class="dt-ico" aria-hidden="true"><img src="assets/icons/gameplay/coach-mode.svg" alt=""></span>
    </label>
    <label class="dock-toggle danger" id="danger-wrap" title="Avisar de piezas en peligro">
      <input type="checkbox" id="toggle-danger" checked><span class="dt-ico" aria-hidden="true"><img src="assets/icons/features/danger-queen.svg" alt=""></span>
    </label>
    <button class="ctrl dock-sound" id="sound-btn" title="Sonido" aria-label="Activar o silenciar el sonido" aria-pressed="true"><img class="vex-icon" src="assets/icons/gameplay/sound-on.svg" alt=""></button>
    <button class="dock-help" id="help-btn" title="Guía y conceptos" aria-label="Guía y conceptos"><img src="assets/icons/gameplay/help.svg" alt="" aria-hidden="true"></button>
    <span class="dock-sep"></span>
    <button class="ctrl dock-moves" id="moves-btn">Jugadas</button>
  </div>

  <div class="modal" id="help-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="help-title">Guía del ajedrez</h2>
        <button class="modal-close" id="help-close">✕</button>
      </div>
      <div class="modal-body">
        <h3 class="cards-title" id="concepts-title">Conceptos básicos</h3>
        <div class="cards" id="help-concepts"></div>
        <h3 class="cards-title" id="pieces-title">Las piezas</h3>
        <div class="cards" id="help-cards"></div>
      </div>
    </div>
  </div>

  <!-- Retomar partida guardada: la posición real en miniatura + ficha -->
  <div class="resume" id="resume" role="dialog" aria-labelledby="resume-title">
    <div class="resume-box">
      <div class="resume-board" id="resume-board" aria-hidden="true"></div>
      <div class="resume-side">
        <span class="resume-tag" id="resume-tag">Partida guardada</span>
        <h2 class="resume-title" id="resume-title">Sigue donde lo dejaste</h2>
        <div class="resume-meta" id="resume-info"></div>
        <div class="resume-actions">
          <button class="btn-play" id="resume-yes">Retomar</button>
          <button class="btn-danger" id="resume-no">Empezar de cero</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmación (reiniciar partida) -->
  <div class="confirm" id="confirm">
    <div class="confirm-box">
      <div class="confirm-msg" id="confirm-msg"></div>
      <div class="confirm-actions">
        <button class="btn-ghost" id="confirm-cancel">Cancelar</button>
        <button class="btn-danger" id="confirm-ok">Reiniciar</button>
      </div>
    </div>
  </div>

  <script type="module" src="theme.js?v=1"></script>
  <script type="module" src="motion.js?v=2"></script>
  <script type="module" src="navbar.js?v=22"></script>
  <script type="module" src="auth.js?v=31"></script>
  <script type="module" src="app.js?v=55"></script>
</body>
</html>
