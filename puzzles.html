<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>VEXCHESS · Puzzles tácticos</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="style.css?v=30">
<link rel="stylesheet" href="puzzles.css?v=1">
</head>
<body class="pz-page">
  <header class="navbar">
    <div class="nav-scrim" aria-hidden="true"></div>
    <a class="nav-brand" href="index.html" aria-label="VEXCHESS · Inicio" title="Inicio">
      <img class="brand-mark" src="assets/knight-logo.svg" alt="">
      <div class="brand-text">
        <img class="wm-img" src="assets/vexchess-wordmark.png" alt="VEXCHESS">
        <span class="tagline">THINK AHEAD.</span>
      </div>
    </a>
    <div class="nav-actions">
      <a class="nav-link" href="index.html">Inicio</a>
      <a class="btn-play" href="play.html">Jugar <span aria-hidden="true">→</span></a>
    </div>
  </header>

  <main class="pz-wrap">
    <div class="pz-boardcol">
      <div id="pz-board" class="pz-board"></div>
    </div>

    <aside class="pz-panel">
      <div class="pz-head">
        <span class="eyebrow">Puzzles tácticos</span>
        <h1 class="pz-title">Encuentra el <span class="accent">mate</span></h1>
      </div>
      <div class="pz-theme-chip" id="pz-theme">—</div>
      <div class="pz-turn" id="pz-turn"></div>
      <div class="pz-status" id="pz-status">Encuentra la mejor jugada.</div>

      <div class="pz-controls">
        <button class="pz-btn" id="pz-hint-btn" title="Pista (H)">💡 Pista</button>
        <button class="pz-btn" id="pz-retry-btn" title="Reiniciar puzzle">↺ Reiniciar</button>
      </div>
      <div class="pz-nav">
        <button class="pz-btn ghost" id="pz-prev-btn" title="Anterior (←)">‹ Anterior</button>
        <button class="pz-btn ghost" id="pz-next-btn" title="Siguiente (→)">Siguiente ›</button>
      </div>

      <div class="pz-meta">
        <span id="pz-progress">Puzzle 1 / 1</span>
        <span id="pz-solved" class="pz-solved">0 resueltos</span>
      </div>

      <p class="pz-tip">Consejo: pulsa una pieza para ver sus jugadas. Atajos: ← → cambian de puzzle, <b>H</b> da pista.</p>
    </aside>
  </main>

  <script type="module" src="puzzles.js?v=1"></script>
</body>
</html>
