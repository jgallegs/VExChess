<!DOCTYPE html>

<head>
<meta charset="utf-8">

<meta property="og:description" content="Encuentra el mate en posiciones reales. Entrena tu táctica gratis en tu navegador.">
<meta property="og:url" content="https://vexchess.jgallegosoto12.workers.dev/puzzles.html">
<meta property="og:image" content="https://vexchess.jgallegosoto12.workers.dev/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VEXCHESS · Puzzles tácticos">
<meta name="twitter:description" content="Encuentra el mate en posiciones reales. Entrena tu táctica gratis en tu navegador.">

<link rel="icon" type="image/png" href="assets/favicon.png">

<link rel="stylesheet" href="style.css?v=41">
<link rel="stylesheet" href="ui.css?v=2">
<link rel="stylesheet" href="motion.css?v=2">
<link rel="stylesheet" href="navbar.css?v=8">
<link rel="stylesheet" href="puzzles.css?v=4">
</head>
<body class="pz-page">
  <header id="vx-nav" data-variant="site"></header>

  <main class="pz-wrap">
    <div class="pz-boardcol">
      <div id="pz-board" class="pz-board"></div>
    </div>

    <aside class="pz-panel">
      <div class="pz-head">
        <span class="eyebrow" data-i18n="puzzles.eyebrow">Puzzles tácticos</span>
        <h1 class="pz-title" data-i18n-html="puzzles.heading">Encuentra el <span class="accent">mate</span></h1>
      </div>
      <div class="pz-theme-chip" id="pz-theme">—</div>
      <div class="pz-turn" id="pz-turn"></div>
      <div class="pz-status" id="pz-status" data-i18n="puzzles.statusDefault">Encuentra la mejor jugada.</div>

      <div class="pz-controls">
        <button class="pz-btn" id="pz-hint-btn" title="Pista (H)" data-i18n-attr="title:puzzles.hintBtnTitle"><img class="vex-icon--button" src="assets/icons/gameplay/hint.svg" alt="" aria-hidden="true"><span data-i18n="puzzles.hintBtn">Pista</span></button>
        <button class="pz-btn" id="pz-retry-btn" title="Reiniciar puzzle" data-i18n-attr="title:puzzles.retryBtnTitle"><img class="vex-icon--button" src="assets/icons/gameplay/reset.svg" alt="" aria-hidden="true"><span data-i18n="puzzles.retryBtn">Reiniciar</span></button>
      </div>
      <div class="pz-nav">
        <button class="pz-btn ghost" id="pz-prev-btn" title="Anterior (←)" data-i18n="puzzles.prevBtn" data-i18n-attr="title:puzzles.prevBtnTitle">‹ Anterior</button>
        <button class="pz-btn ghost" id="pz-next-btn" title="Siguiente (→)" data-i18n="puzzles.nextBtn" data-i18n-attr="title:puzzles.nextBtnTitle">Siguiente ›</button>
      </div>

      <div class="pz-meta">
        <span id="pz-progress">Puzzle 1 / 1</span>
        <span id="pz-solved" class="pz-solved">0 resueltos</span>
      </div>

      <p class="pz-tip" data-i18n-html="puzzles.tip">Consejo: pulsa una pieza para ver sus jugadas. Atajos: ← → cambian de puzzle, <b>H</b> da pista.</p>
    </aside>
  </main>

  <script type="module" src="theme.js?v=1"></script>
  <script type="module" src="motion.js?v=2"></script>
  <script type="module" src="navbar.js?v=7"></script>
  <script type="module" src="auth.js?v=21"></script>
  <script type="module" src="puzzles.js?v=4"></script>
</body>
</html>
